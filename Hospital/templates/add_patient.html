{% extends 'navigationbar.html' %}
{% load static %}
{% block body  %}

<div class="container" style="margin-top:50px">
    <h2 class="text-center">Add Patient</h2>
    <br><br>
    <form method="post" action="">
        {% csrf_token %}
        <label>Patient Name:</label>
        <input type="text" class="form-control" name="name" required>
        <label>Gender:</label>
        <input type="radio"  name="gender"  value="Male" required>Male</input>
        <input type="radio"  name="gender"  value="Female" required>Female</input>
        <br><br>
        <label>Age:</label>
        <input type="numner" class="form-control" name="age" required>
    
        <label>Contact:</label>
        <input type="text" class="form-control" name="mobile" required>
        <label>Address:</label>
        <textarea type="text-area" class="form-control" name="address" required></textarea>
        <br>
        <button type="submit" placeholder="Submit" class="form-control btn btn-primary">Submit</button>
    </form>
</div>


{% if error == "no" %}
<script>
    alert("Record saved  succefully");
    window.location =("{% url 'view_patient' %}")
</script>

{% endif %}

{% if error == "yes" %}
<script>
    alert("Something wrong, Try Again");
</script>
{% endif %}

{% endblock %}

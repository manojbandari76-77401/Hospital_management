{% extends 'navigationbar.html' %}
{% load static %}
{% block body  %} 

<div class="container" style="margin-top:50px">
    <h2 class="text-center">Add Appointment</h2>
    <br><br>
    <form method="post" action="">
         {% csrf_token %}
        <label>Doctor Name:</label>
        <select name="doctor" class="form-control">
            {% for i in doctor %}
            <option value="{{i.name}}">{{i.name}} {{i.id}}</option>
            {% endfor %}
            </select>
        <br>
        <label>Patient:</label>
        <select name="patient" class="form-control">
            {% for i in patient %}
            <option value="{{i.name}}">{{i.name}} [{{i.id}}]</option>
            {% endfor %}
        </select>
        <label>Date:</label>
        <input type="date" class="form-control" name="date">
        <label>Time:</label>
        <input type="time" class="form-control" name="time">
        <br>
        <button type="submit" placeholder="Submit" class="form-control btn btn-primary">Submit</button>
        </select>
    </form>
</div>


{% if error == "no" %}
<script>
    alert("Record savedsuccefully");
    window.location =("{% url 'view_appointment' %}");
</script>

{% endif %}

{% if error == "yes" %}
<script>
    alert("Something wrong, Try Again");
</script>
{% endif %}

{% endblock %}
